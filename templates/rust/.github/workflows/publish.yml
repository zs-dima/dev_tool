# dev_tool templates/rust/.github/workflows/publish.yml @3.0.0
# crates.io through trusted publishing, no token stored: publish the first version by hand, then add
# this repository, the workflow file `publish.yml` and the environment `crates-io` as each crate's
# trusted publisher on crates.io. A library only; a service deletes this file.
name: Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  publish:
    name: crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # crates.io's trusted publishing exchanges this OIDC token
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish
        uses: zs-dima/dev_tool/.github/actions/rust-publish@v3
        # with:
        #   apt-packages: protobuf-compiler
