# dev_tool templates/rust/.github/workflows/ci.yml @3.0.0
# The standard gate is dev_tool's rust-ci.yml over this repository's cargo aliases. A job that needs
# a service, another toolchain or a regenerate-and-diff goes below it as this repository's own.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  gate:
    uses: zs-dima/dev_tool/.github/workflows/rust-ci.yml@v3
    # with:
