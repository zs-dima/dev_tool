# dev_tool templates/rust/release.toml @2.0.0
# cargo-release bumps every crate to one version, commits and pushes; `just release` tags that
# commit once CI has passed on it, and a library's publish.yml publishes the tag.
shared-version = true
consolidate-commits = true
pre-release-commit-message = "chore: release {{version}}"
publish = false
tag = false
push = true
