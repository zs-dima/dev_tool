# dev_tool templates/rust/.cargo/config.toml @2.0.0
# The gate's flags, defined once for `just`, CI (rust-ci.yml) and `my-stack check`. `-D warnings`
# stays in the alias: a target-specific `rustflags` silently replaces `[build] rustflags`, and CI sets
# no RUSTFLAGS.
[alias]
lint = "clippy --workspace --all-targets --all-features -- -D warnings"
test-all = "test --workspace --all-features"
doc-check = "doc --workspace --no-deps --all-features"
# trybuild's compile-fail tests, which rust-ci.yml runs on the MSRV toolchain with `ui: true`:
# ui = "test -p <crate> --test ui"

# Variables for rustc and build scripts; one already set in the environment wins. sqlx's query macros
# read SQLX_OFFLINE, so CI and a fresh checkout build from the committed `.sqlx` cache:
# [env]
# SQLX_OFFLINE = "true"
