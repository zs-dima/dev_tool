# dev_tool templates/rust/.cargo/config.toml @1.0.0
# The gate's flags, defined once for `just`, CI and `my-stack check`. `-D warnings` stays in the
# alias: a target-specific `rustflags` silently replaces `[build] rustflags`.
[alias]
lint = "clippy --workspace --all-targets --all-features -- -D warnings"
test-all = "test --workspace --all-features"
doc-check = "doc --workspace --no-deps --all-features"
