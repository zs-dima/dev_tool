# dev_tool templates/flutter-app/.github/workflows/release-ios.yml @2.0.0
name: "Release · iOS"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to App Store Connect. Off: build, sign and keep the symbols."
        type: boolean
        default: false

concurrency:
  group: release-ios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
      actions: read # the gate probe reads this repository's workflow runs
    uses: zs-dima/dev_tool/.github/workflows/flutter-release-ios.yml@v2
    with:
      publish: ${{ inputs.publish == true }}
      appstore-auto-publish: ${{ vars.APPSTORE_AUTO_PUBLISH == 'true' }}
      sentry: true
      allow-unsymbolicated: ${{ vars.ALLOW_UNSYMBOLICATED == 'true' }}
      # The gate inputs of code-analysis.yml, for a commit without a green push run.
      codegen: committed
      extra-checks: gate-extra
    secrets:
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      # The keys file, one KEY=value per line; each key must be in dev_tool.keys.
      KEYS_ENV: |
        SENTRY_DSN=${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
