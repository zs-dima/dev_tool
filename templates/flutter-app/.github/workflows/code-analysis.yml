# dev_tool templates/flutter-app/.github/workflows/code-analysis.yml @2.0.0
# The release probe asks for push runs of `code-analysis.yml`; the test report triggers on the name.
name: "Code Analysis"

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  gate:
    uses: zs-dima/dev_tool/.github/workflows/flutter-gate.yml@v2
    with:
      codegen: committed
      extra-checks: gate-extra
      # A self-hosted runner: runs-on: '["self-hosted","Linux"]'. DCM: dcm: true and the secrets below.
    # secrets:
    #   DCM_CI_KEY: ${{ secrets.DCM_CI_KEY }}
    #   DCM_EMAIL: ${{ secrets.DCM_EMAIL }}
