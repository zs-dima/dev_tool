# dev_tool templates/dart-package/.github/workflows/tests-report.yml @1.0.0
name: Tests report

# Nothing from the finished run is checked out or executed; the reporter parses its JSON.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    permissions:
      contents: read
      actions: read
      checks: write
    uses: zs-dima/dev_tool/.github/workflows/test-report.yml@v1
    with:
      reporter: dart-json
      path: "**/tests.json"
