# dev_tool templates/dart-package/.github/workflows/tests-report.yml @2.0.0
name: Tests report

# Nothing from the finished run is checked out or executed; the reporter parses its JSON.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    permissions:
      contents: read
      actions: read # downloads the finished run's artifact
      checks: write # publishes the report as a check run
    uses: zs-dima/dev_tool/.github/workflows/test-report.yml@v2
    with:
      reporter: dart-json
