# dev_tool templates/dart-package/.github/workflows/ci.yml @3.0.0
name: CI

on:
  push:
    branches: [main]
    paths: [".github/workflows/**", "bin/**", "lib/**", "test/**", "example/**", "pubspec.yaml", "analysis_options.yaml", "justfile", "mise.toml", "CHANGELOG.md", "README.md", "LICENSE", ".pubignore"]
  pull_request:
    paths: [".github/workflows/**", "bin/**", "lib/**", "test/**", "example/**", "pubspec.yaml", "analysis_options.yaml", "justfile", "mise.toml", "CHANGELOG.md", "README.md", "LICENSE", ".pubignore"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  gate:
    # A package that needs Flutter calls flutter-gate.yml (with example-directory for its example app).
    uses: zs-dima/dev_tool/.github/workflows/dart-gate.yml@v3
    with:
      publish-check: true # false for a package that is not published
