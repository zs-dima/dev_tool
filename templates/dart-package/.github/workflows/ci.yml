# dev_tool templates/dart-package/.github/workflows/ci.yml @1.0.0
name: CI

on:
  push:
    branches: [main]
    paths: [".github/workflows/**", "bin/**", "lib/**", "test/**", "example/**", "pubspec.yaml", "analysis_options.yaml", "dart_test.yaml", "CHANGELOG.md", "README.md", "LICENSE", ".pubignore"]
  pull_request:
    paths: [".github/workflows/**", "bin/**", "lib/**", "test/**", "example/**", "pubspec.yaml", "analysis_options.yaml", "dart_test.yaml", "CHANGELOG.md", "README.md", "LICENSE", ".pubignore"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  ci:
    # A package that needs Flutter calls flutter-package.yml instead.
    uses: zs-dima/dev_tool/.github/workflows/dart-package.yml@v1
    with:
      publish-check: true # false for a private package
