# dev_tool templates/dart-package/.github/workflows/deploy.yml @1.0.0
# pub.dev through OIDC. Publish the first version by hand, then enable automated publishing on the
# package's Admin tab with this repository and the tag pattern `v{{version}}`.
name: Deploy

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
