name: "Gate probe"
description: "Whether this commit already passed the repository's gate in a push run; a release skips its own checks then."

# curl, tr and grep only; any failure of the query ends as green=false, which runs the checks.
# The caller's job needs `actions: read`.
inputs:
  gate-workflow:
    description: "File name of the gate workflow whose successful push run on this commit counts."
    required: false
    default: code-analysis.yml

outputs:
  green:
    description: "`true` when a successful push run of the gate exists for this commit."
    value: ${{ steps.probe.outputs.green }}

runs:
  using: composite
  steps:
    - name: Has this commit already passed the gate?
      id: probe
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GATE: ${{ inputs.gate-workflow }}
      run: |
        set +e
        URL="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$GATE/runs?head_sha=$GITHUB_SHA&status=success&event=push&per_page=1"
        BODY=$(curl -sS --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$URL")
        COUNT=$(printf '%s' "$BODY" | tr ',' '\n' | grep -m1 '"total_count"' | tr -dc '0-9')
        if [ "${COUNT:-0}" -gt 0 ] 2>/dev/null; then
          echo "green=true" >> "$GITHUB_OUTPUT"
          echo "Checks skipped: $GATE already passed on $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "green=false" >> "$GITHUB_OUTPUT"
          echo "Checks running: no successful $GATE push run on $GITHUB_SHA (total_count=${COUNT:-unparsable})." >> "$GITHUB_STEP_SUMMARY"
        fi
        exit 0
