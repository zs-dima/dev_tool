name: "Gate checks"
description: "The checks that decide whether a Flutter app's tree may be released."

# The checks both the push gate and the release's cold path run. Per-app differences are inputs, not
# copies. Expects `setup-flutter` with codegen and format on (the diff below compares regenerated
# bytes); leaves `reports/<pkg>.json` and per-package `coverage/lcov.info`.
inputs:
  working-directory:
    description: "The app's root, when it is not the repository root."
    required: false
    default: "."
  dcm:
    description: "Run DCM with the licence pair (dcm-key, dcm-email)."
    required: false
    default: "false"
  dcm-key:
    description: "secrets.DCM_CI_KEY."
    required: false
    default: ""
  dcm-email:
    description: "secrets.DCM_EMAIL, the other half of the CI licence pair."
    required: false
    default: ""
  github-token:
    description: "github.token, for setup-dcm's release download."
    required: false
    default: ""
  app-audit:
    description: "Run the app's own `dart tool/newapp/audit.dart --ci` (the line's copy audit)."
    required: false
    default: "false"
  l10n-verify:
    description: "Run `l10n_tool:verify` in packages/localization (ARBs against the committed baselines, offline)."
    required: false
    default: "false"
  unused-keys:
    description: "Run packages/localization/tool/unused_keys.dart (every authored row has a reader)."
    required: false
    default: "false"
  setup-node:
    description: "Install Node before the tests, for an npm project named in `dev_tool.test.extra`."
    required: false
    default: "false"
  node-version:
    description: "Node version for setup-node."
    required: false
    default: "24"

runs:
  using: composite
  steps:
    # No filter: the one-liner gives the old filtered pipeline's verdict in all 16 repositories
    # (2026-09-27).
    - name: Formatting
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: dart format --output=none --set-exit-if-changed .

    - name: Generated code is committed
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if ! git diff --exit-code --stat -- lib packages ':!**/*.lock'; then
          git diff --name-only -- lib packages ':!**/*.lock' | sed 's/.*/::error file=&::regenerated, differs from the committed file/'
          echo "::error::Run \`just gen-ci\` (build_runner + format) and commit the result."
          exit 1
        fi

    - name: Analyze
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: flutter analyze

    - name: App audit
      if: inputs.app-audit == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: dart tool/newapp/audit.dart --ci

    # Only where the runner has it; the callers are short and a parse error surfaces on its own.
    - name: Lint the workflows
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: if command -v actionlint >/dev/null 2>&1; then actionlint; fi

    # A missing secret must not turn DCM into a silent no-op.
    - name: DCM key expected
      if: inputs.dcm == 'true' && inputs.dcm-key == '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "::error::DCM_CI_KEY is empty: pass it in the caller's \`secrets:\` or set \`dcm: false\`."
        exit 1

    - name: Install DCM
      if: inputs.dcm == 'true' && inputs.dcm-key != ''
      uses: CQLabs/setup-dcm@87040f30822ed86d362425d3dfadc9866baaa03f # v2.0.2
      with:
        github-token: ${{ inputs.github-token }}

    # An error-severity issue fails; the warning/style backlog reports.
    - name: DCM analyze
      if: inputs.dcm == 'true' && inputs.dcm-key != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DCM_CI_KEY: ${{ inputs.dcm-key }}
        DCM_EMAIL: ${{ inputs.dcm-email }}
      run: dcm analyze . --no-fatal-warnings --no-fatal-style

    # Retried: DCM checks its licence against dcm.dev on every call, and one failed lookup failed a
    # release (2026-09-14).
    - name: DCM unused code, files and l10n
      if: inputs.dcm == 'true' && inputs.dcm-key != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DCM_CI_KEY: ${{ inputs.dcm-key }}
        DCM_EMAIL: ${{ inputs.dcm-email }}
      run: |
        unused() {
          dcm check-unused-code . --exclude-public-api --no-fatal-unused &&
          dcm check-unused-files . --exclude-public-api --no-fatal-unused &&
          dcm check-unused-l10n . --class-pattern "Localization$" --no-fatal-unused
        }
        for attempt in 1 2 3; do
          unused && exit 0
          echo "::warning::DCM attempt $attempt failed; retrying in 10 s"
          sleep 10
        done
        exit 1

    - name: L10n verify
      if: inputs.l10n-verify == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}/packages/localization
      run: dart run l10n_tool:verify

    - name: L10n unused keys
      if: inputs.unused-keys == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}/packages/localization
      run: dart run tool/unused_keys.dart

    - name: Setup Node
      if: inputs.setup-node == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: dart run dev_tool:test_workspace
