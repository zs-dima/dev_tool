name: "Gate checks"
description: "The checks that decide whether a Flutter package's tree may merge or be released."

# One definition for the push gate and the releases' cold path, run after format-check. Expects
# setup-flutter (and, when a recipe runs, setup-just) before it. Leaves `reports/<package>.json` and
# per-package `coverage/lcov.info` behind for the reporter and the summary. No step `uses:` another
# action of this repository: what `$/` means inside a composite action another repository's run loaded
# is not documented (2026-09-28), so every `$/` stays in the workflows.
inputs:
  working-directory:
    description: "The package root, when it is not the repository root."
    required: false
    default: "."
  codegen:
    description: "`committed`: the codegen recipe's output must equal the committed files. `ignored` or `none`: no comparison."
    required: false
    default: "none"
  codegen-recipe:
    description: "The recipe named in the drift message."
    required: false
    default: "gen"
  extra-checks:
    description: "A just recipe with the repository's own checks, run after analyze and before the tests."
    required: false
    default: ""
  dcm:
    description: "Run DCM with the licence pair (dcm-key, dcm-email)."
    required: false
    default: "false"
  dcm-args:
    description: "Arguments of `dcm analyze .`."
    required: false
    default: "--no-fatal-warnings --no-fatal-style"
  dcm-key:
    description: "secrets.DCM_CI_KEY."
    required: false
    default: ""
  dcm-email:
    description: "secrets.DCM_EMAIL, the other half of the CI licence pair."
    required: false
    default: ""

runs:
  using: composite
  steps:
    # A misspelt policy would skip the comparison and pass.
    - name: Inputs
      shell: bash
      env:
        CODEGEN: ${{ inputs.codegen }}
      run: |
        case "$CODEGEN" in none|committed|ignored) ;; *)
          echo "::error::codegen must be none, committed or ignored, got '$CODEGEN'"; exit 1 ;;
        esac

    # Everything `flutter pub get` and the recipe wrote must already be committed: generated Dart,
    # and the platform registrants pub get regenerates for an app's plugins.
    - name: Generated code is committed
      if: inputs.codegen == 'committed'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        RECIPE: ${{ inputs.codegen-recipe }}
      run: |
        DRIFT=$(git status --porcelain --untracked-files=all -- . ':(exclude,glob)**/*.lock')
        if [ -n "$DRIFT" ]; then
          printf '%s\n' "$DRIFT" | cut -c4- | sed 's/.*/::error file=&::differs from the tree after `flutter pub get` and `just '"$RECIPE"'`/'
          echo "::error::Run \`flutter pub get\` and \`just $RECIPE\`, then commit the result."
          exit 1
        fi

    - name: Analyze
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: flutter analyze

    # A missing licence must not turn DCM into a silent no-op; a pull request from a fork or from
    # Dependabot cannot see the repository's secrets, so it is the one place DCM does not run.
    - name: DCM key expected
      if: >-
        inputs.dcm == 'true' && inputs.dcm-key == '' && github.actor != 'dependabot[bot]' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      shell: bash
      run: |
        echo "::error::DCM_CI_KEY is empty: pass it in the caller's \`secrets:\` or set \`dcm: false\`."
        exit 1

    - name: Install DCM
      if: inputs.dcm == 'true' && inputs.dcm-key != ''
      uses: CQLabs/setup-dcm@87040f30822ed86d362425d3dfadc9866baaa03f # v2.0.2
      with:
        github-token: ${{ github.token }}

    - name: DCM analyze
      if: inputs.dcm == 'true' && inputs.dcm-key != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DCM_CI_KEY: ${{ inputs.dcm-key }}
        DCM_EMAIL: ${{ inputs.dcm-email }}
        DCM_ARGS: ${{ inputs.dcm-args }}
      run: |
        # shellcheck disable=SC2086 # the arguments are words; they are split, never evaluated
        dcm analyze . $DCM_ARGS

    - name: Repository checks
      if: inputs.extra-checks != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        RECIPE: ${{ inputs.extra-checks }}
      run: |
        just --show "$RECIPE" >/dev/null 2>&1 \
          || { echo "::error::extra-checks runs \`just $RECIPE\`, and the justfile has no such recipe"; exit 1; }
        just "$RECIPE"

    # The workspace runner where the package depends on dev_tool, as `takt check` decides; plain
    # `flutter test` with the same flags otherwise. Either way the verdict is the JSON report's too:
    # `flutter test` exits 0 on a run its own reporter marked failed (2026-09-14).
    - name: Tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if grep -q '"name": *"dev_tool"' .dart_tool/package_config.json 2>/dev/null; then
          dart run dev_tool:test_workspace
        elif [ -d test ]; then
          mkdir -p reports
          flutter test --coverage --test-randomize-ordering-seed=random --file-reporter json:reports/tests.json
          jq -e 'select(.type == "done") | .success == true' reports/tests.json > /dev/null \
            || { echo "::error::reports/tests.json does not record a finished, successful run"; exit 1; }
        else
          echo "::notice::no test/ directory: no tests ran"
        fi

    # An app's native half runs no Dart: where a repository writes JVM tests they are part of the gate,
    # as they are of `takt check`. The Gradle wrapper is gitignored in Flutter's template;
    # `flutter build apk --config-only` restores it.
    - name: Android unit tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -d android/app/src/test ]; then
          [ -f android/gradlew ] || flutter build apk --config-only
          chmod +x android/gradlew
          ./android/gradlew -p android --console=plain --quiet :app:testDebugUnitTest
        fi
