name: CI

# This repository's gate: the package through dart-gate.yml, the workflows and templates through
# actions-lint.yml, and the fixtures through the workflows they prove: flutter-gate.yml on a pub
# workspace with a member, a standalone extra, committed generated code, a browser test and an
# example app; rust-ci.yml on a Cargo workspace.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  package:
    name: Package
    uses: $/.github/workflows/dart-gate.yml
    with:
      format-exclude: ^fixtures/

  actions-lint:
    name: Actions lint
    uses: $/.github/workflows/actions-lint.yml
    with:
      workflows: .github/workflows/*.yml templates/*/.github/workflows/*.yml
      zizmor-paths: .github templates
      persona: pedantic

  fixture-flutter:
    name: Fixture · Flutter
    uses: $/.github/workflows/flutter-gate.yml
    with:
      working-directory: fixtures/flutter_app
      timeout-minutes: 30
      codegen: committed
      extra-checks: gate-extra
      example-directory: example
      example-builds: web --release
      artifact-name: fixture-flutter-results

  fixture-rust:
    name: Fixture · Rust
    uses: $/.github/workflows/rust-ci.yml
    with:
      working-directory: fixtures/rust_workspace
      extra-aliases: check-all
