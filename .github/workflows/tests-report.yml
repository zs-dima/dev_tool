name: Tests report

# Nothing from the finished run is checked out or executed; the reporter parses its JSON.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  package:
    name: Package
    permissions:
      contents: read
      actions: read # downloads the finished run's artifact
      checks: write # publishes the report as a check run
    uses: $/.github/workflows/test-report.yml
    with:
      reporter: dart-json
      name: Tests

  fixture:
    name: Fixture
    permissions:
      contents: read
      actions: read # downloads the finished run's artifact
      checks: write # publishes the report as a check run
    uses: $/.github/workflows/test-report.yml
    with:
      artifact: fixture-flutter-results
      reporter: flutter-json
      name: Fixture tests
