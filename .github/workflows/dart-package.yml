name: Dart package

# The gate of a pure-Dart package: format, analyze, test (verdict from the JSON report), publish dry
# run. No DCM: its licence is a secret a fork's pull request cannot see; `just dcm` runs it locally.
on:
  workflow_call:
    inputs:
      sdk:
        description: "Dart SDK, as dart-lang/setup-dart takes it."
        type: string
        default: "stable"
      working-directory:
        type: string
        default: "."
      test:
        description: "Run `dart test`. A package without tests sets this to false."
        type: boolean
        default: true
      publish-check:
        description: "Run `pub publish --dry-run`. A private or not-yet-publishable package sets this to false."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ inputs.sdk }}

      - name: Resolve dependencies
        run: dart pub get

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings

      # `dart_test.yaml` declares the JSON reporter read below.
      - name: Test
        if: ${{ inputs.test }}
        run: dart test

      # `dart test` exits 0 on a run its own reporter marked failed (2026-09-14).
      - name: Test verdict
        if: ${{ inputs.test }}
        run: |
          jq -e 'select(.type == "done") | .success == true' reports/tests.json > /dev/null \
            || { echo "::error::reports/tests.json does not record a finished, successful run"; exit 1; }

      - name: Upload test results
        if: ${{ inputs.test && !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: ${{ inputs.working-directory }}/reports/tests.json
          retention-days: 7

      - name: Publish check
        if: ${{ inputs.publish-check }}
        uses: $/.github/actions/publish-check
        with:
          tool: dart
          working-directory: ${{ inputs.working-directory }}
