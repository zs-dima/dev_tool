name: Flutter app gate

# The push/PR gate of a Flutter app in one job. Called by the app's `code-analysis.yml`, whose file
# name and name "Code Analysis" the release probe and the test report key on.
on:
  workflow_call:
    inputs:
      working-directory:
        description: "The app's root inside the repository."
        type: string
        default: "."
      runs-on:
        description: "Runner labels as JSON. A self-hosted runner: '[\"self-hosted\",\"Linux\"]' (never bare self-hosted, which also matches a macOS runner)."
        type: string
        default: '["ubuntu-latest"]'
      timeout-minutes:
        type: number
        default: 60
      app-audit:
        description: "Run the app's own `dart tool/newapp/audit.dart --ci`."
        type: boolean
        default: false
      l10n-verify:
        description: "Run `l10n_tool:verify` in packages/localization."
        type: boolean
        default: false
      unused-keys:
        type: boolean
        default: false
      setup-node:
        type: boolean
        default: false
      node-version:
        type: string
        default: "24"
      artifact-name:
        description: "Name of the uploaded test-results artifact (the test report reads `test-results`)."
        type: string
        default: test-results
      dcm:
        description: "Run DCM with the DCM_CI_KEY and DCM_EMAIL secrets."
        type: boolean
        default: false
    secrets:
      DCM_CI_KEY:
        required: false
      DCM_EMAIL:
        required: false

permissions:
  contents: read

jobs:
  gate:
    name: Format · Analyze · Test
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: $/.github/actions/setup-flutter
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Gate
        uses: $/.github/actions/gate-checks
        with:
          working-directory: ${{ inputs.working-directory }}
          dcm: ${{ inputs.dcm }}
          dcm-key: ${{ secrets.DCM_CI_KEY }}
          dcm-email: ${{ secrets.DCM_EMAIL }}
          github-token: ${{ github.token }}
          app-audit: ${{ inputs.app-audit }}
          l10n-verify: ${{ inputs.l10n-verify }}
          unused-keys: ${{ inputs.unused-keys }}
          setup-node: ${{ inputs.setup-node }}
          node-version: ${{ inputs.node-version }}

      - name: Coverage summary
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          {
            echo "### Coverage"
            echo
            echo "| Package | Lines | Covered | % |"
            echo "|---|---:|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"
          ROOT_PKG=$(sed -n 's/^name: *//p' pubspec.yaml | head -1)
          TOTAL_F=0; TOTAL_H=0
          while IFS= read -r LCOV; do
            PKG=$(dirname "$(dirname "$LCOV")"); PKG=${PKG#./}
            [ "$PKG" = "." ] && PKG="$ROOT_PKG"
            F=$(awk -F: '/^LF:/ {s+=$2} END {print s+0}' "$LCOV")
            H=$(awk -F: '/^LH:/ {s+=$2} END {print s+0}' "$LCOV")
            [ "${F:-0}" -eq 0 ] && continue
            TOTAL_F=$((TOTAL_F + F)); TOTAL_H=$((TOTAL_H + H))
            echo "| \`$PKG\` | $F | $H | $((H * 100 / F))% |" >> "$GITHUB_STEP_SUMMARY"
          done < <(find . -name lcov.info -path '*/coverage/*' -not -path './build/*')
          if [ "$TOTAL_F" -gt 0 ]; then
            echo "| **total** | **$TOTAL_F** | **$TOTAL_H** | **$((TOTAL_H * 100 / TOTAL_F))%** |" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Read by `test-report.yml`; a full storage quota must not turn the gate red.
      - name: Upload test results
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/reports/
          retention-days: 7
