name: Flutter app release · iOS

# Archive, sign and optionally upload a Flutter app to App Store Connect. The gate job (probe, and
# the checks only when no green push run exists for this sha) runs on Linux; only the archive needs
# a Mac. Signing uses the App Store Connect API key with `-allowProvisioningUpdates`, nothing
# installed per run. `flutter build ipa` cannot pass the key to xcodebuild, hence `--config-only`
# and xcodebuild.
on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner of the gate job (Linux), labels as JSON."
        type: string
        default: '["ubuntu-latest"]'
      mac-runs-on:
        description: "Runner of the archive job, labels as JSON; a self-hosted Mac: '[\"self-hosted\",\"macOS\",\"ARM64\"]'."
        type: string
        default: '["macos-latest"]'
      publish:
        type: boolean
        default: false
      appstore-auto-publish:
        description: "Upload on a tag too; the caller passes `vars.APPSTORE_AUTO_PUBLISH == 'true'`."
        type: boolean
        default: false
      allow-unsymbolicated:
        type: boolean
        default: false
      gate-workflow:
        type: string
        default: code-analysis.yml
      app-audit:
        description: "Run the app's own `dart tool/newapp/audit.dart --ci`."
        type: boolean
        default: false
      l10n-verify:
        type: boolean
        default: true
      unused-keys:
        type: boolean
        default: false
      setup-node:
        type: boolean
        default: false
      node-version:
        type: string
        default: "24"
      dcm:
        type: boolean
        default: true
    secrets:
      APP_STORE_CONNECT_KEY_IDENTIFIER:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
      APP_STORE_CONNECT_PRIVATE_KEY:
        required: true
      SENTRY_AUTH_TOKEN:
        required: false
      SENTRY_ORG:
        required: false
      SENTRY_DSN:
        required: false
      DCM_CI_KEY:
        required: false
      DCM_EMAIL:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: Gate
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - name: Has this sha already passed the gate?
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ inputs.gate-workflow }}
        run: |
          # curl, tr and grep only; any failure ends as green=false, which runs the checks.
          set +e
          URL="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$GATE/runs?head_sha=$GITHUB_SHA&status=success&event=push&per_page=1"
          BODY=$(curl -sS --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$URL")
          COUNT=$(printf '%s' "$BODY" | tr ',' '\n' | grep -m1 '"total_count"' | tr -dc '0-9')
          if [ "${COUNT:-0}" -gt 0 ] 2>/dev/null; then
            echo "green=true" >> "$GITHUB_OUTPUT"
            echo "Checks skipped: $GATE already passed on $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
            echo "Checks running: no successful $GATE push run on $GITHUB_SHA (total_count=${COUNT:-unparsable})." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Checkout
        if: steps.probe.outputs.green != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        if: steps.probe.outputs.green != 'true'
        uses: $/.github/actions/setup-flutter

      - name: Gate
        if: steps.probe.outputs.green != 'true'
        uses: $/.github/actions/gate-checks
        with:
          dcm: ${{ inputs.dcm }}
          dcm-key: ${{ secrets.DCM_CI_KEY }}
          dcm-email: ${{ secrets.DCM_EMAIL }}
          github-token: ${{ github.token }}
          app-audit: ${{ inputs.app-audit }}
          l10n-verify: ${{ inputs.l10n-verify }}
          unused-keys: ${{ inputs.unused-keys }}
          setup-node: ${{ inputs.setup-node }}
          node-version: ${{ inputs.node-version }}

  build:
    name: Archive · Sign · Upload
    needs: gate
    runs-on: ${{ fromJSON(inputs.mac-runs-on) }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      PUBLISH: ${{ (inputs.publish || inputs.appstore-auto-publish) && (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch) }}
    steps:
      - name: Xcode and disk
        run: |
          xcodebuild -version
          MAJOR=$(xcodebuild -version | sed -n '1s/Xcode \([0-9]*\).*/\1/p')
          # App Store uploads require Xcode 26+ since 2026-04-28.
          [ "${MAJOR:-0}" -ge 26 ] || { echo "::error::Xcode $MAJOR is below the App Store minimum of 26"; exit 1; }
          FREE=$(df -g / | awk 'NR==2 {print $4}')
          [ "$FREE" -ge 20 ] || { echo "::error::only ${FREE}G free; an archive with a fresh SDK needs 20G"; exit 1; }

      - name: App Store Connect and Sentry configuration expected
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ALLOW_UNSYMBOLICATED: ${{ inputs.allow-unsymbolicated }}
        run: |
          MISSING=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do [ -n "${!name}" ] || MISSING="$MISSING $name"; done
          if [ "$ALLOW_UNSYMBOLICATED" != "true" ]; then
            for name in SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_DSN; do [ -n "${!name}" ] || MISSING="$MISSING $name"; done
          fi
          [ -z "$MISSING" ] || { echo "::error::missing secrets:$MISSING"; exit 1; }

      # Before the archive: `errSecInternalComponent` mid-archive means the runner's session cannot
      # reach the key. A hosted Mac signs in the cloud.
      - name: codesign can reach the signing key
        if: runner.environment == 'self-hosted'
        run: |
          ID=$(security find-identity -v -p codesigning | sed -n '1s/.*\([0-9A-F]\{40\}\).*/\1/p')
          [ -n "$ID" ] || { echo "::error::no code-signing identity in this session's keychain"; exit 1; }
          PROBE="$RUNNER_TEMP/codesign-probe"; cp /usr/bin/true "$PROBE"
          codesign --force --sign "$ID" "$PROBE" || { echo "::error::codesign cannot use the key in this session"; exit 1; }
          rm -f "$PROBE"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # sentry's `set-commits --auto` walks back to the previous release
          persist-credentials: false

      # A copied pubspec files the symbols under another app's Sentry project without any error.
      - name: Sentry project expected
        if: ${{ !inputs.allow-unsymbolicated }}
        run: |
          PROJECT=$(sed -n '/^sentry:/,/^[^ ]/s/^  project: *//p' pubspec.yaml | head -1)
          [ -n "$PROJECT" ] || { echo "::error file=pubspec.yaml::sentry.project is not set"; exit 1; }

      - name: Setup Flutter
        uses: $/.github/actions/setup-flutter
        with:
          codegen: "false"

      # The line clock (seven digits): a ten-digit number would raise the App Store floor for good.
      - name: Version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then NAME="${GITHUB_REF_NAME#v}"; else
            NAME="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml | head -1)"; fi
          NUMBER="$(dart run dev_tool:build_number ios)"
          [ "$NUMBER" -gt 3000000 ] && [ "$NUMBER" -lt 5000000 ] || { echo "::error::$NUMBER is outside the minutes-since-2020 range"; exit 1; }
          { echo "NAME=$NAME"; echo "NUMBER=$NUMBER"; } >> "$GITHUB_ENV"
          echo "Building $NAME (+$NUMBER)" >> "$GITHUB_STEP_SUMMARY"

      - name: config/keys.env and the App Store Connect key
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" > config/keys.env
          # `altool` finds the key in $API_PRIVATE_KEYS_DIR; removed in the always() step at the end.
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Flutter · project configuration
        run: |
          flutter build ios --release --config-only \
            --build-name="$NAME" --build-number="$NUMBER" \
            --dart-define-from-file=config/production.env \
            --dart-define-from-file=config/keys.env \
            --obfuscate --split-debug-info=build/symbols
          # Without these the archive succeeds and every stack trace of the release is unreadable.
          CFG=ios/Flutter/Generated.xcconfig
          grep -Fqx 'DART_OBFUSCATION=true' "$CFG" || { echo "::error::$CFG lost DART_OBFUSCATION"; exit 1; }
          grep -q '^SPLIT_DEBUG_INFO=' "$CFG" || { echo "::error::$CFG lost SPLIT_DEBUG_INFO"; exit 1; }
          grep -Fqx "FLUTTER_BUILD_NUMBER=$NUMBER" "$CFG" || { echo "::error::$CFG does not carry $NUMBER"; exit 1; }
          grep -Fqx "FLUTTER_BUILD_NAME=$NAME" "$CFG" || { echo "::error::$CFG does not carry $NAME"; exit 1; }

      - name: Archive and export
        timeout-minutes: 45
        run: |
          [ -f ios/ExportOptions.plist ] || { echo "::error file=ios/ExportOptions.plist::missing"; exit 1; }
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # caffeinate: the Mac must not sleep mid-archive.
          caffeinate -dims xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive "${AUTH[@]}"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist ios/ExportOptions.plist "${AUTH[@]}"

      # The .app (codesign misreads the .ipa) carries the asked-for version, an Apple Distribution
      # signature and a TestFlight profile.
      - name: The IPA is what was asked for
        run: |
          set -- "$RUNNER_TEMP"/ipa/*.ipa; IPA="$1"
          [ -f "$IPA" ] || { echo "::error::no IPA was exported"; exit 1; }
          rm -rf "$RUNNER_TEMP/check"; unzip -q -o "$IPA" -d "$RUNNER_TEMP/check"
          set -- "$RUNNER_TEMP"/check/Payload/*.app; APP="$1"
          BUILT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          [ "$BUILT" = "$NUMBER" ] && [ "$SHORT" = "$NAME" ] || { echo "::error::built $SHORT ($BUILT), asked for $NAME ($NUMBER)"; exit 1; }
          codesign -dvv "$APP" 2>&1 | grep -q '^Authority=Apple Distribution' || { echo "::error::not signed by an Apple Distribution identity"; exit 1; }
          security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null | grep -q 'beta-reports-active' \
            || { echo "::error::the embedded profile is not a store/TestFlight profile"; exit 1; }
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Size budget
        run: dart run dev_tool:size_gate --ipa "$IPA" --summary "$GITHUB_STEP_SUMMARY" --label "$NAME (+$NUMBER)"

      - name: Upload symbols to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' }}
        timeout-minutes: 10
        run: dart run sentry_dart_plugin

      # Unregenerable; the IPA is not kept (nobody outside TestFlight can install it).
      - name: Keep the symbols
        continue-on-error: true
        run: |
          mkdir -p build/dSYMs
          cp -R "$RUNNER_TEMP/Runner.xcarchive/dSYMs/." build/dSYMs/ 2>/dev/null || true
      - name: Upload symbols
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-symbols-${{ env.NAME }}-${{ env.NUMBER }}
          path: |
            build/symbols
            build/dSYMs
          if-no-files-found: error
          retention-days: 7

      - name: Upload to App Store Connect
        if: env.PUBLISH == 'true'
        timeout-minutes: 20
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
        run: |
          xcrun altool --upload-app --type ios -f "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded $NAME (+$NUMBER); TestFlight shows it after Apple's processing." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the App Store Connect key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
