name: Flutter package

# The gate of a package that needs the Flutter SDK, plus its example app. The Flutter version is the
# pubspec's `flutter: ">=X"` bound unless pinned.
on:
  workflow_call:
    inputs:
      flutter-version:
        description: "Exact Flutter version; empty derives it from the pubspec's lower bound."
        type: string
        default: ""
      working-directory:
        type: string
        default: "."
      example-directory:
        description: "Path of the example app inside working-directory. Empty skips the example job."
        type: string
        default: ""
      artifact-name:
        description: "Name of the uploaded test-results artifact (the test report reads `test-results`)."
        type: string
        default: test-results
      publish-check:
        description: "Run `pub publish --dry-run`. A private package sets this to false."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: $/.github/actions/setup-flutter
        with:
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
          codegen: "false"

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --file-reporter=json:reports/tests.json

      # `flutter test` exits 0 on a run its own reporter marked failed (2026-09-14).
      - name: Test verdict
        run: |
          jq -e 'select(.type == "done") | .success == true' reports/tests.json > /dev/null \
            || { echo "::error::reports/tests.json does not record a finished, successful run"; exit 1; }

      - name: Upload test results
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/reports/tests.json
          retention-days: 7

      - name: Publish check
        if: ${{ inputs.publish-check }}
        uses: $/.github/actions/publish-check
        with:
          tool: flutter
          working-directory: ${{ inputs.working-directory }}

  example:
    name: Example
    if: ${{ inputs.example-directory != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}/${{ inputs.example-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: $/.github/actions/setup-flutter
        with:
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}/${{ inputs.example-directory }}
          version-from: ${{ inputs.working-directory }}
          codegen: "false"

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --file-reporter=json:reports/example-tests.json

      - name: Test verdict
        run: |
          jq -e 'select(.type == "done") | .success == true' reports/example-tests.json > /dev/null \
            || { echo "::error::reports/example-tests.json does not record a finished, successful run"; exit 1; }

      - name: Build web
        run: flutter build web --release

      - name: Build apk
        run: flutter build apk --debug
