name: fixture_app
description: The Flutter consumer dev_tool's own CI runs its Flutter workflows against.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.5"

workspace:
  - packages/fixture_core

dependencies:
  flutter:
    sdk: flutter
  fixture_core:
    path: packages/fixture_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints_tool: ^1.1.1
  # This checkout, so the fixture runs the executables at the commit under test.
  dev_tool:
    path: ../..

dev_tool:
  test:
    extra: [tool/fixture_dart]
