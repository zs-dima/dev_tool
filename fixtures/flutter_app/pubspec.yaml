name: fixture_app
description: The smallest Flutter app the reusable gate and package workflows run against in dev_tool's own CI.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints_tool: ^1.1.1
  # This checkout, so the fixture runs the executables at the commit under test.
  dev_tool:
    path: ../..
