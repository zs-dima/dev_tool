name: dev_tool
description: Shared developer tooling for standalone Dart and Flutter repositories (workspace test runner, kit linking, build numbers, release notes, size gate).

# Consumed by git tag (`tag_pattern: v{{version}}`): pub.dev refuses the name as too similar to
# `devtools` (2026-09-27), and the name stays.
publish_to: none

version: 1.0.1

homepage: https://github.com/zs-dima/dev_tool
repository: https://github.com/zs-dima/dev_tool
issue_tracker: https://github.com/zs-dima/dev_tool/issues

environment:
  sdk: ^3.13.4

executables:
  test_workspace: test_workspace
  kit: kit
  size_gate: size_gate
  release_notes: release_notes
  build_number: build_number
  check_keys: check_keys

dependencies:
  yaml: ^3.1.3

dev_dependencies:
  lints_tool: ^1.1.1
  test: ^1.26.3
